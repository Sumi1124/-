name: Build SourceDesk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .app + .dmg
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx

      - name: Build (Release, universal, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project SourceDesk.xcodeproj \
            -scheme SourceDesk \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log
          echo "--- build tail ---"
          tail -40 build/xcodebuild.log
          test -d "build/Build/Products/Release/SourceDesk.app"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: warn

      - name: Package DMG
        run: |
          set -euxo pipefail
          out="build/dmgroot"
          mkdir -p "$out"
          cp -R "build/Build/Products/Release/SourceDesk.app" "$out/"
          ln -s /Applications "$out/Applications"
          hdiutil create \
            -volname "SourceDesk" \
            -srcfolder "$out" \
            -ov \
            -format UDZO \
            "SourceDesk.dmg"

      - name: Verify DMG
        run: hdiutil verify SourceDesk.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SourceDesk-dmg
          path: SourceDesk.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SourceDesk.dmg \
            --title "SourceDesk $GITHUB_REF_NAME" \
            --notes "Universal macOS app (Apple Silicon + Intel). Unsigned — on first open, right-click the app and choose **Open**."
